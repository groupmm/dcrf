name: dcrf

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python >=3.10,<3.14
  - pip >=25.0
  - pytorch >=2.0,<3.0
  - numpy >=2.0,<3.0
  - matplotlib-base >=3.8,<4.0
  - librosa >=0.10,<2.0
  - ipykernel >=6.0
  - pytest >=7.0
  - pip:
    - nnAudio >=0.3,<0.4
    - pre-commit >=4.6.0,<5.0.0
    - -e .
