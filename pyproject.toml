[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dcrf"
version = "1.0.0"
description = "Linear-chain CRFs and differentiable Viterbi decoding in PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sebastian Strahl", email = "sebastian.strahl@audiolabs-erlangen.de"},
    {name = "Johannes Zeitler", email = "johannes.zeitler@audiolabs-erlangen.de"},
    {name = "Meinard Müller", email = "meinard.mueller@audiolabs-erlangen.de"},
]
dependencies = [
    "torch>=2.0.0",
]
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/groupmm/dcrf"

[project.optional-dependencies]
demo = [
    "ipykernel>=6.0.0",
    "librosa>=0.10.0",
    "matplotlib>=3.8.0",
    "nnAudio>=0.3.0",
    "numpy>=2.0.0",
]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["dcrf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
